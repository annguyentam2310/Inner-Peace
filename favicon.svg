<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="200" height="200" rx="36"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F8E6BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8E6BE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="200" height="200" fill="#F5EFE6"/>
    <circle cx="100" cy="86" r="48" fill="url(#glow)"/>

    <!-- ngôi sao và chấm nhỏ góc trên trái -->
    <path d="M32 34 L35 42 L43 45 L35 48 L32 56 L29 48 L21 45 L29 42 Z" fill="#C9A96E"/>
    <circle cx="24" cy="66" r="2.4" fill="#C9A96E" opacity="0.75"/>
    <circle cx="40" cy="94" r="1.8" fill="#6E9C82" opacity="0.6"/>

    <!-- dãy núi -->
    <path d="M0 148 Q 45 118 90 142 T 200 138 L200 200 L0 200 Z" fill="#A9C2AE" opacity="0.55"/>
    <path d="M0 164 Q 50 134 100 158 T 200 156 L200 200 L0 200 Z" fill="#7FA88C" opacity="0.8"/>
    <path d="M0 180 Q 55 154 100 176 T 200 172 L200 200 L0 200 Z" fill="#3D7D6B"/>

    <!-- con đường uốn lượn -->
    <path d="M100 200 C 96 186 108 176 100 162 C 92 150 106 140 100 128"
          stroke="#FAF6F0" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- vòng la bàn -->
    <circle cx="100" cy="86" r="48" fill="none" stroke="#C9A96E" stroke-width="1.6"/>
    <circle cx="100" cy="86" r="40" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.5"/>

    <!-- kim la bàn 8 hướng -->
    <g>
      <polygon points="100,26 105,86 95,86" fill="#C9A96E"/>
      <polygon points="100,134 105,86 95,86" fill="#3D7D6B" opacity="0.85"/>
      <polygon points="156,86 100,81 100,91" fill="#3D7D6B" opacity="0.85"/>
      <polygon points="44,86 100,81 100,91" fill="#3D7D6B" opacity="0.85"/>
      <polygon points="138,48 100,83 100,89" fill="#8FB49B" opacity="0.6"/>
      <polygon points="62,48 100,83 100,89" fill="#8FB49B" opacity="0.6"/>
      <polygon points="138,124 100,89 100,83" fill="#8FB49B" opacity="0.6"/>
      <polygon points="62,124 100,89 100,83" fill="#8FB49B" opacity="0.6"/>
    </g>

    <!-- tâm la bàn + trái tim -->
    <circle cx="100" cy="86" r="16" fill="#FAF6F0" stroke="#3D7D6B" stroke-width="2"/>
    <path transform="translate(90,75.5) scale(0.2)" fill="#C9A96E"
          d="M50 30 C 35 10, 0 15, 0 37 C 0 65, 35 80, 50 95 C 65 80, 100 65, 100 37 C 100 15, 65 10, 50 30 Z"/>
  </g>
</svg>
